name: Release CLI
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to finish or repair
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-cli-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Validate version and release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "v$(cat version.txt)"
      - name: Install static C toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and verify static CLI
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ inputs.tag }}
          CC: musl-gcc
          CGO_ENABLED: '1'
        run: |
          go test -tags 'sqlite_fts5 sqlite_omit_load_extension' ./cmd/edda ./fileproject ./backup
          mkdir -p dist package
          go build -tags 'sqlite_fts5 sqlite_omit_load_extension' -trimpath -ldflags "-X main.version=${TAG#v} -linkmode external -extldflags -static" -o package/edda ./cmd/edda
          test "$(package/edda version)" = "edda ${TAG#v}"
          package/edda --help
          cp version.txt package/
          tar -C package -czf "dist/edda-${TAG}-linux-${ARCH}.tar.gz" edda version.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Publish complete CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        working-directory: dist
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo 'Release is already published; refusing to replace assets.' >&2
            exit 1
          fi
          test -f "edda-${TAG}-linux-amd64.tar.gz"
          test -f "edda-${TAG}-linux-arm64.tar.gz"
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release upload "$TAG" ./*.tar.gz SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false
          gh label create 'autorelease: tagged' --color 0E8A16 --force
          for number in $(gh api "repos/$GH_REPO/commits/$TAG/pulls" --jq '.[] | select(.merged_at != null and .base.ref == "main" and (.head.ref | startswith("release-please--branches--main"))) | .number'); do
            gh pr edit "$number" --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'
          done
