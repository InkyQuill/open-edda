name: Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Go format, vet and race tests
        run: |
          test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          go vet -tags sqlite_fts5 ./...
          go test -race -tags sqlite_fts5 ./...
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Typecheck, production build and unit tests
        working-directory: frontend
        run: |
          bun run build
          bun run test
      - name: Install headless browser
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Desktop and mobile integration tests
        working-directory: frontend
        run: bunx playwright test --config playwright.files.config.ts
      - name: CLI terminal integration
        run: |
          go build -tags sqlite_fts5 -o /tmp/open-edda .
          go build -tags sqlite_fts5 -o /tmp/edda ./cmd/edda
          python3 scripts/check-cli-interactive.py /tmp/edda /tmp/open-edda
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure
          path: frontend/.playwright/test-results
          retention-days: 7
          if-no-files-found: ignore
