# Open Edda: TLS on the host, HTTP routing through the existing Istio Gateway.
server {
    listen 80;
    server_name edda.inky.su;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name edda.inky.su;
    include ssl.inky.su;
    include ssl.security;
    server_tokens off;
    client_max_body_size 64m;
    access_log /var/log/nginx/edda_access.log;
    error_log /var/log/nginx/edda_error.log;
    location / {
        proxy_pass http://127.0.0.1:30880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
