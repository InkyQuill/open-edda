apiVersion: v1
kind: Namespace
metadata:
  name: open-edda
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-edda-data
  namespace: open-edda
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-edda
  namespace: open-edda
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: open-edda}
  template:
    metadata:
      labels: {app: open-edda}
    spec:
      nodeSelector:
        kubernetes.io/hostname: yggdrasil
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: open-edda
          image: docker.io/library/open-edda:20261007-quiet-ui-v1
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          envFrom:
            - secretRef: {name: open-edda-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /api/health, port: 8080}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /api/health, port: 8080}
          livenessProbe:
            httpGet: {path: /api/health, port: 8080}
            initialDelaySeconds: 15
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: open-edda-data}
---
apiVersion: v1
kind: Service
metadata:
  name: open-edda
  namespace: open-edda
spec:
  selector: {app: open-edda}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-edda
  namespace: open-edda
spec:
  hostnames: [edda.inky.su]
  parentRefs:
    - name: ingress-gw
      namespace: istio-ingress
      sectionName: http
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: open-edda
          port: 8080
      timeouts:
        request: 300s
        backendRequest: 300s
